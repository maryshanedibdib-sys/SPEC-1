<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>BASIC CALCULATOR</h1>
    <label for="num1InputField"> Enter 1st number:</label>
    <input type="number" id="num1InputField">
    <br>
    <label for="num2InputField"> Enter 2nd number:</label>
    <input type="number" id="num2InputField">
    <br>
    <button id="addButton">+</button>
    <button id="subButton">-</button>
    <button id="mulButton">x</button>
    <button id="divButton">÷</button>
    
</body>
</html>
